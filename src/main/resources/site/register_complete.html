<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>%sitename% | 本登録完了</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2BA3EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!--
  本登録完了ページ（本登録メールのURLを開いたとき）。クライアント支給デザイン（community_register_complete_pc.html）をそのまま使用。
  サーバー側で置換されるタグ（前後を % で囲んで使用）: sitename brand top_blur year contact_mailto footer profile_url
  （PublicSiteService）。フッターは固定表示（%footer% を消してもページの最後に表示されます）。
-->
<style>
:root{
  --ink:#16324A; --ink-2:#4F6679; --line:#D5E5EF;
  --sea:#0F74C2; --sea-dark:#0B5F9E; --sea-bright:#2BA3EC;
  --lagoon:#E3F4FC; --foam:#EEF8FC;
  --pink:#DD1470; --pink-hover:#C40E62; --pink-bright:#FF4F9A; --pink-soft:#FFE8F2;
  --navy:#0E2B45;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;
  --wrap:1120px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:var(--font);font-weight:500;font-size:16px;line-height:1.8;color:var(--ink);background:var(--foam);-webkit-font-smoothing:antialiased}
img,svg{display:block}
a{color:inherit;text-decoration:none}
h1,h2{margin:0;line-height:1.45;letter-spacing:.02em;font-feature-settings:"palt"}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--sea-bright);outline-offset:3px;border-radius:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 24px;border-radius:999px;font-weight:700;font-size:16px;line-height:1.2;transition:background-color .2s,box-shadow .2s,transform .12s}
.btn:active{transform:translateY(1px)}
.btn svg{width:22px;height:22px;flex:none}
.btn-pink{background:var(--pink);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 28px -12px rgba(221,20,112,.75)}
.btn-pink:hover{background:var(--pink-hover)}
.btn-lg{min-height:60px;padding:0 40px;font-size:18px}

/* ---------- Header ---------- */
.site-header{position:relative;z-index:2;padding-top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.9);border-bottom:1px solid rgba(213,229,239,.8)}
.header-in{max-width:var(--wrap);height:68px;margin:0 auto;padding:0 20px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:.02em;color:var(--pink)}
.brand svg{width:26px;height:26px;color:var(--pink-bright)}
.brand img{height:44px;width:auto;max-width:260px;object-fit:contain}

/* ---------- 上部の帯（メイン画像をぼかして使用） ---------- */
.band{position:relative;isolation:isolate;overflow:hidden;height:220px}
.band::before{content:"";position:absolute;inset:-80px;z-index:-2;background:url(%top_blur%) center/cover no-repeat;filter:blur(40px) saturate(1.3);transform:scale(1.1)}
.band::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.25) 100%)}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:60px;color:var(--foam)}

/* ---------- 完了カード ---------- */
main{flex:1;padding:0 20px 96px}
.card{position:relative;z-index:1;max-width:620px;margin:-150px auto 0;padding:40px 48px 40px;background:#fff;border-radius:28px;border:1px solid rgba(213,229,239,.7);box-shadow:0 34px 70px -36px rgba(14,70,120,.5);text-align:center;animation:card-in .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes card-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 進み具合：入力 → 仮登録 → 本登録（すべて完了） */
.tracker{list-style:none;display:flex;justify-content:center;align-items:flex-start;margin:0 auto 26px;padding:0;max-width:380px}
.tracker li{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.tracker li+li::before{content:"";position:absolute;top:17px;right:calc(50% + 24px);width:calc(100% - 48px);height:2px;background:var(--sea-bright)}
.tracker li:last-child::before{transform-origin:left;animation:line .4s .3s ease-out both}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sea);color:#fff}
.dot svg{width:18px;height:18px}
.tracker li:last-child{color:var(--sea)}
.tracker li:last-child .dot{animation:pop .45s .65s cubic-bezier(.2,.8,.3,1.4) both}
@keyframes line{from{transform:scaleX(0)}to{transform:none}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

/* ハートのアイコンと、はじけるハート（読み込み時に1回だけ） */
.welcome-icon{position:relative;width:88px;height:88px;margin:0 auto 18px}
.welcome-icon .circle{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--pink-soft);color:var(--pink-bright)}
.welcome-icon .circle svg{width:42px;height:42px;animation:beat .6s 1s ease-out both}
.burst{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;color:var(--pink-bright);opacity:0;animation:burst 1.1s 1s ease-out both}
.burst svg{width:100%;height:100%}
.burst:nth-child(2){--tx:-62px;--ty:-34px}
.burst:nth-child(3){--tx:60px;--ty:-40px;color:var(--sea-bright)}
.burst:nth-child(4){--tx:-56px;--ty:30px;color:var(--sea-bright)}
.burst:nth-child(5){--tx:64px;--ty:26px}
.burst:nth-child(6){--tx:4px;--ty:-66px;width:10px;height:10px}
@keyframes beat{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1)}}

.card h1{font-size:clamp(24px,3.4vw,30px);font-weight:900}
.welcome{margin-top:4px;font-size:19px;font-weight:700;color:var(--pink)}
.lead{margin-top:16px;color:var(--ink-2);word-break:auto-phrase;text-wrap:balance}
.cta{margin-top:28px}
.cta .btn{min-width:300px}

/* プロフィールのすすめ */
.tips{margin-top:32px;padding:24px 26px;border-radius:20px;background:var(--foam);text-align:left}
.tips-items{list-style:none;display:flex;justify-content:center;gap:28px;margin:0 0 18px;padding:0}
.tips-items li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}
.tips-items span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--sea);box-shadow:0 8px 18px -12px rgba(14,70,120,.5)}
.tips-items svg{width:24px;height:24px}
.tips p{color:var(--ink-2);font-size:15px}
.tips p+p{margin-top:8px}
.tips .note{margin-top:14px;font-size:13px}

/* ---------- Responsive ---------- */
@media (max-width:760px){
  .header-in{height:58px;padding:0 16px}
  .brand{font-size:19px}
  .brand svg{width:22px;height:22px}
  .brand img{height:36px;max-width:170px}
  .band{height:160px}
  .wave{height:30px}
  main{padding:0 16px 64px}
  .card{margin-top:-110px;padding:30px 20px 24px;border-radius:24px}
  .welcome-icon{width:76px;height:76px}
  .welcome-icon .circle svg{width:36px;height:36px}
  .welcome{font-size:17px}
  .lead{text-align:left;text-wrap:pretty;word-break:normal}
  .cta .btn{min-width:0;width:100%}
  .tips{margin-top:26px;padding:20px 18px}
  .tips-items{gap:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .burst{display:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.4-4.5-9.5-9.2C1 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.3 2.5.7-1.3 2.2-2.5 4.3-2.5 3.7 0 5.7 3.9 4.2 7.3C19.4 16.5 12 21 12 21z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.8 4.2-5.5 7.5-5.5s6.1 1.7 7.5 5.5"/></g></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h3l1.8-2.5h6.4L17 7.5h3a1 1 0 011 1V18a1 1 0 01-1 1H4a1 1 0 01-1-1V8.5a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/></g></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></g></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
</svg>

<header class="site-header">
  <div class="header-in">
    <a class="brand" href="/" aria-label="%sitename% トップ">%brand%</a>
  </div>
</header>

<div class="band" aria-hidden="true">
  <svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none"><path fill="currentColor" d="M0 34c120-18 240-26 360-18s240 34 360 30 240-30 360-34 240 12 360 24v24H0z"/></svg>
</div>

<main>
  <section class="card" aria-labelledby="complete-title">
    <ol class="tracker" aria-label="登録の進み具合">
      <li><span class="dot"><svg aria-hidden="true"><use href="#i-check"/></svg></span>入力<span class="sr-only">（完了）</span></li>
      <li><span class="dot"><svg aria-hidden="true"><use href="#i-check"/></svg></span>仮登録<span class="sr-only">（完了）</span></li>
      <li aria-current="step"><span class="dot"><svg aria-hidden="true"><use href="#i-check"/></svg></span>本登録<span class="sr-only">（完了）</span></li>
    </ol>

    <div class="welcome-icon" aria-hidden="true">
      <div class="circle"><svg><use href="#i-heart"/></svg></div>
      <span class="burst"><svg><use href="#i-heart"/></svg></span>
      <span class="burst"><svg><use href="#i-heart"/></svg></span>
      <span class="burst"><svg><use href="#i-heart"/></svg></span>
      <span class="burst"><svg><use href="#i-heart"/></svg></span>
      <span class="burst"><svg><use href="#i-heart"/></svg></span>
    </div>

    <h1 id="complete-title">本登録が完了しました！</h1>
    <p class="welcome">%sitename%へようこそ！</p>

    <p class="lead">本登録が完了しました。<br>さっそく下のボタンからプロフィールを登録して、%sitename%をはじめましょう！</p>

    <div class="cta">
      <!-- %profile_url% = プロフィール編集画面 -->
      <a class="btn btn-pink btn-lg" href="%profile_url%"><svg aria-hidden="true"><use href="#i-user"/></svg>プロフィール登録</a>
    </div>

    <div class="tips">
      <ul class="tips-items" aria-label="登録できる内容の例">
        <li><span><svg aria-hidden="true"><use href="#i-camera"/></svg></span>写真</li>
        <li><span><svg aria-hidden="true"><use href="#i-pen"/></svg></span>自己紹介</li>
        <li><span><svg aria-hidden="true"><use href="#i-star"/></svg></span>趣味</li>
      </ul>
      <p>プロフィールを充実させると、あなたのことを他のユーザーにもっと知ってもらいやすくなります。</p>
      <p>写真や自己紹介、趣味などを登録して、あなたらしいプロフィールを作ってみましょう。</p>
      <p class="note">※プロフィールはあとから変更することもできます。</p>
    </div>
  </section>
</main>

%footer%

</body>
</html>
