<section class="box">
    <div class="boxline"></div>
    <div class="person">
        <div class="avatar">👤</div>
        <div class="grow"><b>%toname%</b>　<small>25歳</small>
            <div class="pbtns"><a class="smallbtn">写真閲覧</a><a class="smallbtn">友達追加</a><a class="smallbtn">プロフ閲覧</a>
            </div>
        </div>
    </div>
    <form>
        <div class="row">
            <div class="key">タイトル</div>
            <div class="field"><input type="text"></div>
        </div>
        <div class="row">
            <div class="key">本文</div>
            <div class="field"><textarea></textarea></div>
        </div>
        <div class="row">
            <div class="key">アドレス添付</div>
            <div class="field"><label><input type="checkbox"> アドレスを添付 <span class="cost">（600ポイント）</span></label></div>
        </div>
        <div class="row">
            <div class="key">写真添付</div>
            <div class="field"><input type="file" accept="image/*"> <span class="cost">0ポイント</span></div>
        </div>
        <div class="actions"><button class="btn">送信</button></div>
    </form>
</section>
