<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>専用HTMLプレビュー</title>
    <link rel="stylesheet" th:href="@{/css/reply.css}"/>
    <style>
        /* Mirror the user-facing reply page (templates/reply/page.html) structurally, but
           per operator request (2026-09-09) the preview's HTML fills the full remaining
           viewport height. The 入力欄 / 送信フォーム is not shown here — this preview is
           for the HTML only (client request 2026-10-07). */
        .reply-header-frame {
            display: block; width: 100%; height: calc(100vh - 52px);
            border: 0; background: #fff;
        }
        .preview-banner { position: sticky; top: 0; z-index: 30; }
    </style>
</head>
<body>

<!-- Banners use inline styles because reply.css is the only stylesheet loaded
     on this page (Tailwind is NOT available here, so utility classes like
     bg-amber-50 / flex / gap-3 have no effect). Keep tokens inline. -->
<div class="preview-banner"
     style="position:sticky;top:0;z-index:30;background:#fffbeb;border-bottom:1px solid #fde68a;padding:10px 16px;font-size:.85rem;color:#78350f;font-family:sans-serif;display:flex;align-items:center;gap:14px;flex-wrap:wrap;line-height:1.5;">
    <strong style="color:#7c2d12;">管理者プレビュー</strong>
    <span th:if="${(user.loginId != null and !#strings.isEmpty(user.loginId)) or user.id != null}">ユーザーID
        <code th:text="${user.loginId != null and !#strings.isEmpty(user.loginId)} ? ${user.loginId} : ${user.id}" style="background:#fff;padding:1px 6px;border-radius:3px;border:1px solid #fde68a;"></code>
    </span>
    <span th:if="${user.displayName}" th:text="'(' + ${user.displayName} + ')'"></span>
    <span style="opacity:.85;color:#92400e;">置き換えタグはこのユーザーの値で差し替えています。</span>
</div>

<div th:if="${usingDefaultHtml and !siteDefaultPreview}"
     style="background:#f0f9ff;border-bottom:1px solid #bae6fd;padding:8px 16px;font-size:.78rem;color:#075985;font-family:sans-serif;line-height:1.5;">
    このユーザーには専用HTMLが未設定です。
</div>
<div th:if="${repaired}"
     style="background:#fef2f2;border-bottom:1px solid #fecaca;padding:8px 16px;font-size:.78rem;color:#991b1b;font-family:sans-serif;line-height:1.5;">
    メモのHTMLに <code style="background:#fff;padding:1px 6px;border-radius:3px;border:1px solid #fecaca;">&lt;/style&gt;</code> または
    <code style="background:#fff;padding:1px 6px;border-radius:3px;border:1px solid #fecaca;">&lt;script&gt;</code> の不足が検出されたため、プレビューでは自動修復しています。
    実際のユーザー画面でも正しく表示されるよう、専用HTMLの保存内容をご確認のうえ修正ください。
</div>

<!-- Same DOM structure as templates/reply/page.html so reply.css applies identically. -->
<div class="reply-shell">

    <iframe class="reply-header-frame"
            sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox"
            th:attr="srcdoc=${memoText} ?: '&lt;p style=&quot;padding:24px;color:#94a3b8;&quot;&gt;専用HTMLが未設定です。&lt;/p&gt;'"></iframe>

</div>

<div class="preview-tags" style="background:#f8fafc;max-width:768px;margin:0 auto;padding:24px;font-family:sans-serif;">
    <h2 style="font-size:14px;font-weight:600;color:#334155;margin-bottom:12px;">タグ解決状況</h2>
    <table style="width:100%;font-size:14px;border:1px solid #e2e8f0;background:#fff;border-radius:6px;border-collapse:collapse;overflow:hidden;">
        <thead style="background:#f8fafc;font-size:12px;color:#64748b;text-transform:uppercase;">
            <tr>
                <th style="padding:8px 12px;text-align:left;width:176px;">タグ</th>
                <th style="padding:8px 12px;text-align:left;">現在の値</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${bindings}" style="border-top:1px solid #f1f5f9;">
                <td style="padding:8px 12px;"><code style="background:#f1f5f9;padding:2px 8px;border-radius:3px;" th:text="${b.key}"></code></td>
                <td style="padding:8px 12px;" th:text="${b.value}"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
