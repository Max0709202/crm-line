<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LINE用ページ確認 | CRM</title>
    <!-- 番組デザイン設定 › LINE用（スマホ限定）check: one LINE用 page (…/site-design/line-preview) in a
         スマホ-width frame. Same look as the ログイン後 check (site-design-member-preview.html). -->
    <style>
        body { margin:0; background:#1e293b; font-family:system-ui,"Noto Sans JP",sans-serif; color:#e2e8f0; }
        .bar { position:sticky; top:0; z-index:5; background:#0f172a; padding:10px 16px; }
        .bar .row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
        .bar .ttl { font-weight:700; margin-right:8px; }
        .bar a { color:#cbd5e1; text-decoration:none; padding:5px 12px; border-radius:6px; border:1px solid #334155; font-size:13px; }
        .bar a.on { background:#06c755; border-color:#06c755; color:#fff; }
        .bar .w { margin-left:auto; font-size:12px; color:#94a3b8; }
        .stage { padding:20px; overflow-x:auto; }
        iframe { display:block; margin:0 auto; background:#fff; height:calc(100vh - 110px); box-shadow:0 10px 30px rgba(0,0,0,.4);
                 border-radius:18px; border:10px solid #0f172a; }
    </style>
</head>
<body>
<div class="bar">
    <div class="row">
        <span class="ttl">LINE用ページ確認（スマホ）</span>
        <a th:each="p : ${linePages}" th:href="@{/manager/settings/site-design/line-preview-frame(page=${p.key})}"
           th:classappend="${p.key == page} ? 'on'" th:text="${p.value}">受信BOX</a>
        <span class="w" th:text="'表示幅 ' + ${width} + 'px（保存済みの内容・会員情報とページの中身はサンプル）'">表示幅</span>
    </div>
</div>
<div class="stage">
    <iframe th:src="@{/manager/settings/site-design/line-preview(page=${page})}"
            th:style="'width:' + ${width} + 'px'" title="LINE用ページ"></iframe>
</div>
</body>
</html>
