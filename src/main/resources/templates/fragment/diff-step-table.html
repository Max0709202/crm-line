<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Shared table for every "list of DiffScheduleStep rows" screen — kept in one place so the
  3 pages that show diff-schedule steps (差分スケジュール履歴, ユーザー詳細の差分スケジュール
  確認/削除, 一斉送信/返信履歴の差分予約表示) never drift out of sync with each other
  (2026-09-10 operator request: unify all 3 into one column layout).

  Params:
    steps         — List<DiffScheduleStep> (already the current page's slice)
    schedulesById — Map<Long, DiffSchedule>, keyed by DiffScheduleStep.diffScheduleId
    userInfoById  — Map<Long, Map<String,String>> keyed by DiffSchedule.id (only present when
                    that schedule has exactly one target user), inner map holding
                    "displayName" — used for 表示名. FROM is intentionally left blank
                    everywhere: a diff MESSAGE step's FROM address isn't resolved until it
                    actually sends (BroadcastService picks it per-recipient from the carrier
                    pool at send time), so there's nothing real to show before that.
    lineAccountNames — Map<Long, String> LINE account id → name, for キャラ名 (LINE steps only;
                    id -1 = 紐づきアカ, resolved per recipient at send time)
    indexOffset   — int, unused since the No column became ユーザーID (2026-10-02); kept so callers don't change
    checkboxForm  — id of the external <form> the row checkboxes submit into (select-delete),
                    or null/empty to omit the checkbox column entirely (public-facing screens)
-->
<table th:fragment="table(steps, schedulesById, userInfoById, lineAccountNames, indexOffset, checkboxForm)"
       class="min-w-full divide-y divide-slate-200 text-sm">
    <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider">
    <tr>
        <th th:if="${checkboxForm != null and !checkboxForm.isEmpty()}" class="px-2 py-2 text-left" style="width:32px;">
            <input type="checkbox" class="diff-tbl-check-all" title="全選択"/>
        </th>
        <!-- Column order per 2026-10-02 client request (2nd revision):
             ID 種別 対象 条件 ステップ 表示名 キャラ名 件名 本文 ステータス セット日時 実行/取消日時 結果.
             ID = target user ID; ステップ = step number, with the 差分名 (link to ステップ編集) under it. -->
        <th class="px-2 py-2 text-left" style="width:44px;">ID</th>
        <th class="px-2 py-2 text-left">種別</th>
        <th class="px-2 py-2 text-left">対象</th>
        <th class="px-2 py-2 text-left">条件</th>
        <th class="px-2 py-2 text-left">ステップ</th>
        <th class="px-2 py-2 text-left">表示名</th>
        <th class="px-2 py-2 text-left">キャラ名</th>
        <th class="px-2 py-2 text-left">件名</th>
        <th class="px-2 py-2 text-left diff-tbl-body">本文</th>
        <th class="px-2 py-2 text-left">ステータス</th>
        <th class="px-2 py-2 text-left">セット日時</th>
        <th class="px-2 py-2 text-left">実行/取消日時</th>
        <th class="px-2 py-2 text-left">結果</th>
    </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
    <tr th:if="${steps == null or steps.empty}">
        <td colspan="14" class="px-3 py-6 text-center text-slate-400">該当する差分スケジュールはありません</td>
    </tr>
    <tr th:each="s, iter : ${steps}" class="hover:bg-slate-50" th:with="sched=${schedulesById.get(s.diffScheduleId)}">
        <td th:if="${checkboxForm != null and !checkboxForm.isEmpty()}" class="px-2 py-1.5">
            <input type="checkbox" class="diff-tbl-row-item" name="ids" th:value="${s.id}" th:attr="form=${checkboxForm}"/>
        </td>
        <!-- ユーザーID: the single target user, or the first ID + 他N名 for multi-user schedules (full list on hover). -->
        <td class="px-2 py-1.5 text-xs font-mono text-slate-600 whitespace-nowrap"
            th:with="uids=${sched != null and sched.targetUserIds != null} ? ${#strings.arraySplit(sched.targetUserIds, ',')} : null"
            th:title="${sched != null} ? ${sched.targetUserIds} : null"
            th:text="${uids == null or uids.length == 0} ? '-' : (${uids.length == 1} ? ${uids[0]} : ${uids[0]} + ' 他' + ${uids.length - 1} + '名')"></td>
        <td class="px-2 py-1.5 text-xs whitespace-nowrap">
            <span th:if="${s.stepType == 'MESSAGE' or s.stepType == 'MESSAGE_IMAGE'}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                  th:classappend="${s.channel == 'SMS'} ? 'bg-yellow-100 text-yellow-800' : (${s.channel == 'LINE'} ? '' : 'bg-blue-100 text-blue-700')"
                  th:style="${s.channel == 'LINE'} ? 'background:#d9f7e6;color:#046c3a;' : null"
                  th:text="(${s.channel == 'SMS'} ? 'SMS' : (${s.channel == 'LINE'} ? 'LINE' : 'メール')) + (${s.stepType == 'MESSAGE_IMAGE'} ? '・画像付き' : '')"></span>
            <span th:if="${s.stepType == 'HTML_SWITCH'}" th:text="'HTML切替→スロット' + ${s.memoSlotSnapshot}"></span>
        </td>
        <td class="px-2 py-1.5 text-xs" th:if="${sched != null}">
            <a class="font-mono text-blue-600 hover:underline"
               th:href="@{/manager/users(ids=${sched.targetUserIds})}"
               th:text="${#strings.arraySplit(sched.targetUserIds, ',').length} + ' 名'"></a>
        </td>
        <td class="px-2 py-1.5 text-xs text-slate-400" th:if="${sched == null}">-</td>
        <td class="px-2 py-1.5 text-xs text-slate-600" th:if="${sched != null}">
            <span th:if="${sched.targetType == 'PHONE'}">番号縛り</span>
            <span th:if="${sched.targetType == 'EMAIL'}">アドレス縛り</span>
            <span th:if="${sched.targetType == 'FOLDER'}">フォルダ縛り</span>
            <span th:if="${sched.targetType == 'LINE_NAME'}">LINE名前縛り</span>
            <span th:if="${sched.targetType == 'ID'}">ID縛り</span>
            <span th:if="${sched.targetType == 'REGISTER'}">新規登録(自動)</span>
            <div th:if="${sched.targetType != 'REGISTER' and sched.targetValue != null and !#strings.isEmpty(sched.targetValue)}"
                 class="text-slate-500 truncate" style="max-width:180px;"
                 th:text="${sched.targetValue}" th:title="${sched.targetValue}"></div>
        </td>
        <td class="px-2 py-1.5 text-xs text-slate-400" th:if="${sched == null}">-</td>
        <td class="px-2 py-1.5 text-slate-700 whitespace-nowrap">
            <div class="text-xs font-semibold" th:text="${s.stepOrder != null} ? 'ステップ' + ${s.stepOrder + 1} : '-'"></div>
            <a th:if="${sched != null and sched.diffDefinitionId != null}"
               class="text-xs text-blue-600 hover:underline" title="ステップ編集を開く"
               th:href="@{'/manager/settings/diff-schedule/definitions/' + ${sched.diffDefinitionId} + '/steps'}"
               th:text="${sched.diffNameSnapshot}"></a>
            <span th:unless="${sched != null and sched.diffDefinitionId != null}" class="text-xs text-slate-500"
                  th:text="${sched != null ? sched.diffNameSnapshot : ''}"></span>
        </td>
        <td class="px-2 py-1.5 text-xs text-slate-600"
            th:with="uinfo=${userInfoById != null and sched != null} ? ${userInfoById.get(sched.id)} : null">
            <div th:text="${uinfo != null} ? ${uinfo.get('displayName')} : '-'"></div>
            <!-- フォルダ（フォルダ設定の色）: 差分スケジュール履歴 passes folderColors -->
            <span th:if="${uinfo != null and uinfo.get('folder') != null and folderColors != null}"
                  class="inline-block mt-0.5 px-1.5 rounded text-[11px] font-semibold text-slate-700 bg-slate-100"
                  th:style="${folderColors.get(uinfo.get('folder')) != null} ? 'background:' + ${folderColors.get(uinfo.get('folder'))}"
                  th:text="${uinfo.get('folder')}">フォルダ</span>
        </td>
        <!-- キャラ名: LINE = LINEアカウント, メール / SMS = 差分のキャラ (stepCharaNames, when the page passes it) -->
        <td class="px-2 py-1.5 text-xs text-slate-600 whitespace-nowrap"
            th:text="${s.channel == 'LINE'} ? (${s.lineAccountId == null} ? '-' : (${s.lineAccountId == -1} ? '紐づきアカ' : (${lineAccountNames != null and lineAccountNames.get(s.lineAccountId) != null} ? ${lineAccountNames.get(s.lineAccountId)} : '-'))) : (${stepCharaNames != null and stepCharaNames.get(s.id) != null} ? ${stepCharaNames.get(s.id)} : '-')"></td>
        <td class="px-2 py-1.5 text-xs text-slate-600" th:text="${s.subjectSnapshot} ?: '-'"></td>
        <td class="px-2 py-1.5 diff-tbl-body">
            <div class="diff-tbl-body-text" th:text="${s.bodySnapshot} ?: '-'"></div>
        </td>
        <td class="px-2 py-1.5">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold"
                  th:classappend="${s.status == 'EXECUTED'} ? 'bg-emerald-100 text-emerald-700' :
                                  (${s.status == 'PENDING'} ? 'bg-amber-100 text-amber-800' :
                                  (${s.status == 'CANCELLED'} ? 'bg-slate-100 text-slate-700' : 'bg-red-100 text-red-700'))"
                  th:text="${s.status == 'EXECUTED'} ? '実行済み' : (${s.status == 'PENDING'} ? '保留中' : (${s.status == 'CANCELLED'} ? '取消済み' : '失敗'))"></span>
        </td>
        <td class="px-2 py-1.5 text-xs text-slate-500" th:text="${sched != null ? #temporals.format(sched.setAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
        <td class="px-2 py-1.5 text-xs text-slate-500"
            th:text="${s.executedAt != null ? #temporals.format(s.executedAt, 'yyyy-MM-dd HH:mm') : (s.cancelledAt != null ? #temporals.format(s.cancelledAt, 'yyyy-MM-dd HH:mm') : (s.status == 'PENDING' ? ('予定: ' + #temporals.format(s.scheduledFor, 'yyyy-MM-dd HH:mm')) : '-'))}"></td>
        <td class="px-2 py-1.5 text-xs text-slate-500 truncate" style="max-width:220px;"
            th:text="${s.status == 'CANCELLED'} ? ('取消者: ' + (${s.cancelledByAdminName} ?: '-')) : ${s.resultDetail}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
