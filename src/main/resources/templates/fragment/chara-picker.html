<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 送信キャラ (キャラ登録) — 1名だけ選択。フォルダを選ぶとそのフォルダのキャラだけが候補になる。
     キャラ検索（名前・ID）で候補を絞り込める。キャラ指定なし = サポート窓口から送信。
     Needs ${charaFolders} / ${charas} in the model. Used by 一斉送信・SMS配信 and 差分ステップ. */-->
<div th:fragment="picker(fieldName, selectedId)" class="chara-picker" data-chara-picker
     style="display:flex; flex-direction:column; gap:3px;">
    <label style="font-size:.78rem; color:#475569; font-weight:600;">送信キャラ
        <span style="font-weight:400; color:#94a3b8;">(フォルダを選ぶとその中から選べます・1名のみ)</span></label>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <select data-chara-folder style="flex:0 1 11em; min-width:8em;" title="キャラのフォルダ">
            <option value="">全フォルダ</option>
            <option th:each="f : ${charaFolders}" th:value="${f.id}" th:text="${f.name}">フォルダ</option>
            <option value="none">未分類</option>
        </select>
        <input type="search" data-chara-search placeholder="キャラ検索（名前・ID）" autocomplete="off"
               style="flex:0 1 13em; min-width:9em;" title="名前またはIDで絞り込み（Enterで先頭の候補を選択）"/>
        <select th:name="${fieldName}" data-chara-select style="flex:1 1 14em; min-width:10em;" title="送信キャラ">
            <option value="" style="font-weight:700; color:#fff; background:#0f766e;">キャラ指定なし → サポート窓口</option>
            <option th:each="c : ${charas}" th:value="${c.id}"
                    th:attr="data-folder=${c.folderId != null} ? ${c.folderId} : 'none',data-name=${c.name}"
                    th:selected="${selectedId != null and selectedId == c.id}"
                    th:text="'ID:' + ${c.id} + ' ' + ${c.name} + (${c.gender == 'female'} ? '（女性）' : '（男性）')">キャラ</option>
        </select>
    </div>
    <div style="display:flex; align-items:center; gap:8px; min-height:1.4em;">
        <span data-chara-support
              style="display:none; padding:2px 10px; border-radius:999px; background:#0f766e; color:#fff; font-size:.74rem; font-weight:700; letter-spacing:.02em;">🎧 サポート窓口から送信</span>
        <span data-chara-hint style="font-size:.7rem; color:#94a3b8;"></span>
    </div>
    <script>
    (function () {
        // Runs once per page; sets up every picker not yet set up.
        if (!window.initCharaPickers) {
            window.initCharaPickers = function () {
                document.querySelectorAll('[data-chara-picker]:not([data-ready])').forEach(function (box) {
                    box.setAttribute('data-ready', '1');
                    var folder = box.querySelector('[data-chara-folder]');
                    var search = box.querySelector('[data-chara-search]');
                    var select = box.querySelector('[data-chara-select]');
                    var badge = box.querySelector('[data-chara-support]');
                    var hint = box.querySelector('[data-chara-hint]');
                    var all = Array.prototype.slice.call(select.options, 1).map(function (o) {
                        return { value: o.value, text: o.text, folder: o.getAttribute('data-folder'),
                                 name: (o.getAttribute('data-name') || '').toLowerCase() };
                    });
                    function matches(c, q) {
                        if (!q) return true;
                        return c.value === q || c.value.indexOf(q) === 0 || c.name.indexOf(q) >= 0;
                    }
                    // キャラ指定なし = サポート窓口: shown clearly apart from the キャラ
                    function showSender() {
                        var support = select.value === '';
                        badge.style.display = support ? 'inline-block' : 'none';
                        select.style.borderColor = support ? '#0f766e' : '';
                        select.style.boxShadow = support ? '0 0 0 2px rgba(15,118,110,.2)' : '';
                        select.style.fontWeight = support ? '700' : '';
                        select.style.color = support ? '#0f766e' : '';
                    }
                    function render() {
                        var keep = select.value;
                        var q = search.value.trim().toLowerCase().replace(/^id[:：]?\s*/, '');
                        while (select.options.length > 1) select.remove(1);
                        var hits = 0;
                        all.forEach(function (c) {
                            if (folder.value && c.folder !== folder.value) return;
                            // The chosen キャラ stays listed while searching, so typing never drops the choice.
                            var hit = matches(c, q);
                            if (!hit && c.value !== keep) return;
                            if (hit) hits++;
                            var o = new Option(c.text, c.value);
                            o.setAttribute('data-folder', c.folder);
                            select.add(o);
                        });
                        select.value = keep;
                        if (select.value !== keep) select.value = '';
                        hint.textContent = q ? (hits ? hits + '件ヒット' : '該当するキャラはありません') : '';
                        showSender();
                    }
                    // A saved choice opens on its folder.
                    var chosen = all.filter(function (c) { return c.value === select.value; })[0];
                    if (chosen) folder.value = chosen.folder;
                    render();
                    folder.addEventListener('change', render);
                    search.addEventListener('input', render);
                    search.addEventListener('keydown', function (e) {
                        if (e.key !== 'Enter') return;
                        e.preventDefault();   // never submit the form from the search box
                        var q = search.value.trim().toLowerCase().replace(/^id[:：]?\s*/, '');
                        var first = Array.prototype.slice.call(select.options, 1).filter(function (o) {
                            var c = all.filter(function (x) { return x.value === o.value; })[0];
                            return c && matches(c, q);
                        })[0];
                        if (first) { select.value = first.value; showSender(); }
                    });
                    select.addEventListener('change', showSender);
                });
            };
        }
        window.initCharaPickers();
    })();
    </script>
</div>
</body>
</html>
