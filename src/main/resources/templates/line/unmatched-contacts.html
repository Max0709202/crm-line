<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>未紐付けのLINE連絡先</title>
    <style>
        .list-page-footer {
            background:#fff; border-top:1px solid #e2e8f0;
            padding:9px 20px; display:flex; align-items:center; justify-content:flex-end; gap:12px;
            box-shadow:0 -1px 4px rgba(0,0,0,.05); margin-top:12px;
        }
        .list-page-footer .selected-count { font-size:.78rem; color:#64748b; }
        .list-page-footer .btn-bulk-delete {
            font-family:inherit; font-size:.82rem; font-weight:700;
            padding:7px 16px; border-radius:6px; border:none; color:#fff; cursor:pointer; white-space:nowrap;
            background:#dc2626; box-shadow:0 1px 3px rgba(220,38,38,.25);
        }
        .list-page-footer .btn-bulk-delete:hover:not(:disabled) { background:#b91c1c; }
        .list-page-footer .btn-bulk-delete:disabled { background:#94a3b8; cursor:not-allowed; box-shadow:none; }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">未紐付けのLINE連絡先</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/line-settings}">LINE設定に戻る</a>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        現在はLINEを友だち追加した時点で顧客情報が自動的に作成されるため、通常この一覧には表示されません。
        ここに残っているのは、その仕組みが導入される前からの連絡先です。すでにお持ちの顧客情報と統合したい場合は、
        <a class="text-blue-600 hover:underline" th:href="@{/manager/users}">ユーザー管理</a>で該当の顧客IDを確認し、下記フォームに入力してください。
    </p>

    <div th:if="${unmatched == null or unmatched.empty}" class="bg-white rounded-lg shadow-sm border border-slate-100 p-6 text-center text-slate-400">
        未紐付けの連絡先はありません
    </div>

    <form method="post" th:action="@{/manager/line-settings/unmatched/bulk-link}"
          th:if="${suggestions != null and !suggestions.empty}"
          class="bg-white rounded-lg shadow-sm border border-slate-100 p-4 mb-4">
        <input type="hidden" name="_csrf" th:value="${_csrf}"/>
        <p class="text-sm font-medium text-slate-700 mb-2">表示名が一致する候補（チェックを外すと対象から除外できます）</p>
        <div th:each="s : ${suggestions}" class="flex items-center gap-2 text-sm py-1">
            <input type="checkbox" name="pair" th:value="${s.lineUser.id} + ':' + ${s.crmUser.id}" checked/>
            <span th:text="${s.lineUser.lineDisplayName}"></span>
            <span class="text-slate-400">⇨</span>
            <span th:text="'顧客ID ' + ${s.crmUser.id} + ' (' + (${s.crmUser.displayName} ?: '(表示名なし)') + ')'"></span>
        </div>
        <button type="submit" class="mt-3 px-3 py-1.5 text-sm text-white rounded-md" style="background:#06C755;">選択した候補をまとめて紐付け</button>
    </form>

    <div class="bg-white rounded-lg shadow-sm border border-slate-100 overflow-x-auto" th:if="${unmatched != null and !unmatched.empty}">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-3 py-2 text-left" style="width:32px;"><input type="checkbox" id="unmCheckAll" title="全選択"/></th>
                    <th class="px-3 py-2 text-left">LINE表示名</th>
                    <th class="px-3 py-2 text-left" style="width:160px;">送信元アカウント</th>
                    <th class="px-3 py-2 text-left" style="width:220px;">LINEユーザーID</th>
                    <th class="px-3 py-2 text-left">最新メッセージ</th>
                    <th class="px-3 py-2 text-left" style="width:150px;">最終受信</th>
                    <th class="px-3 py-2 text-right" style="width:220px;">顧客IDと紐付け</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="u : ${unmatched}">
                    <td class="px-3 py-2"><input type="checkbox" class="unm-row-item" name="ids" th:value="${u.id}" form="unmBulkForm"/></td>
                    <td class="px-3 py-2">
                        <img th:if="${u.linePictureUrl != null}" th:src="${u.linePictureUrl}" class="inline-block w-6 h-6 rounded-full mr-2" alt=""/>
                        <span th:text="${u.lineDisplayName != null ? u.lineDisplayName : '(表示名不明)'}"></span>
                    </td>
                    <td class="px-3 py-2 text-slate-600 text-xs" th:text="${accountNames.get(u.lineAccountId)}"></td>
                    <td class="px-3 py-2 text-slate-400 font-mono text-xs" th:text="${u.lineUserId}"></td>
                    <td class="px-3 py-2 text-slate-600 max-w-xs truncate" th:text="${u.lastMessagePreview}"></td>
                    <td class="px-3 py-2 text-slate-500 text-xs"
                        th:text="${u.lastMessageAt != null ? #temporals.format(u.lastMessageAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                    <td class="px-3 py-2 text-right whitespace-nowrap">
                        <form method="post" th:action="@{'/manager/line-settings/unmatched/' + ${u.id} + '/link'}" class="inline-flex gap-1 items-center">
                            <input type="hidden" name="_csrf" th:value="${_csrf}"/>
                            <input type="number" name="crmUserId" placeholder="顧客ID" required class="tw-input" style="width:90px; padding:0.25rem 0.5rem; font-size:0.8rem;"/>
                            <button type="submit" class="px-2 py-1 text-xs text-white rounded" style="background:#06C755;">紐付け</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <form id="unmBulkForm" method="post" th:action="@{/manager/line-settings/unmatched/bulk-delete}"
          th:if="${unmatched != null and !unmatched.empty}">
        <input type="hidden" name="_csrf" th:value="${_csrf}"/>
        <div class="list-page-footer">
            <span class="selected-count" id="unmSelectedCount"></span>
            <button type="submit" class="btn-bulk-delete" id="btnUnmDelete" disabled
                    onclick="return confirmUnmDelete();">選択削除</button>
        </div>
    </form>

    <script th:if="${unmatched != null and !unmatched.empty}">
    (function () {
        var checkAll = document.getElementById('unmCheckAll');
        var btn = document.getElementById('btnUnmDelete');
        var label = document.getElementById('unmSelectedCount');
        function rows() { return document.querySelectorAll('.unm-row-item'); }
        function refresh() {
            var n = [].filter.call(rows(), function (c) { return c.checked; }).length;
            label.textContent = n > 0 ? (n + ' 件選択中') : '';
            btn.disabled = n === 0;
            checkAll.indeterminate = n > 0 && n < rows().length;
            checkAll.checked = rows().length > 0 && n === rows().length;
        }
        checkAll.addEventListener('change', function () {
            [].forEach.call(rows(), function (c) { c.checked = checkAll.checked; });
            refresh();
        });
        document.addEventListener('change', function (e) {
            if (e.target.classList && e.target.classList.contains('unm-row-item')) refresh();
        });
        window.confirmUnmDelete = function () {
            var n = [].filter.call(rows(), function (c) { return c.checked; }).length;
            if (n === 0) return false;
            if (!confirm('選択した ' + n + ' 件の未紐付け連絡先を削除します。削除後、その方がもう一度友だち追加すると、新しい顧客として自動登録されます。よろしいですか?')) return false;
            var pw = prompt('管理者パスワードを入力してください');
            if (!pw) return false;
            var f = document.getElementById('unmBulkForm');
            var h = f.querySelector('input[name="confirmPassword"]');
            if (!h) { h = document.createElement('input'); h.type = 'hidden'; h.name = 'confirmPassword'; f.appendChild(h); }
            h.value = pw;
            return true;
        };
    })();
    </script>
</section>
</body>
</html>
