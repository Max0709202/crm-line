<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>LINE自動返信設定</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4 gap-2">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">LINE自動返信設定 — <span th:text="${account?.name}"></span></h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/line-settings}">LINE設定に戻る</a>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        「友だち追加時」は最初に友だち追加された瞬間に一度だけ送信されます。「キーワード一致時」は受信メッセージの本文に
        キーワードが含まれていれば（大文字小文字を区別しません）送信されます。上から順に評価され、最初に一致したルールのみ送信されます。
    </p>

    <div class="bg-white rounded-lg shadow-sm border border-slate-100 overflow-x-auto mb-4">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-3 py-2 text-left" style="width:70px;">順序</th>
                    <th class="px-3 py-2 text-left" style="width:140px;">トリガー</th>
                    <th class="px-3 py-2 text-left" style="width:100px;">返信タイミング</th>
                    <th class="px-3 py-2 text-left">返信本文</th>
                    <th class="px-3 py-2 text-left" style="width:90px;">状態</th>
                    <th class="px-3 py-2 text-right" style="width:140px;">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:if="${rules == null or rules.empty}">
                    <td colspan="6" class="px-3 py-6 text-center text-slate-400">自動返信ルールはまだ登録されていません</td>
                </tr>
                <tr th:each="r : ${rules}">
                    <td class="px-3 py-2 text-slate-500" th:text="${r.sortOrder}"></td>
                    <td class="px-3 py-2">
                        <span th:if="${r.triggerType == 'FOLLOW'}" class="px-2 py-0.5 text-xs rounded bg-sky-100 text-sky-700">友だち追加時</span>
                        <span th:if="${r.triggerType == 'KEYWORD'}" class="px-2 py-0.5 text-xs rounded bg-amber-100 text-amber-700"
                              th:text="'キーワード: ' + ${r.keyword}"></span>
                    </td>
                    <td class="px-3 py-2 text-slate-500 text-xs"
                        th:text="${r.delayMinutes != null and r.delayMinutes > 0} ? (${r.delayMinutes} + '分後') : '即時'"></td>
                    <td class="px-3 py-2 text-slate-700 max-w-md truncate" th:text="${r.replyBody}"></td>
                    <td class="px-3 py-2">
                        <form method="post" th:action="@{'/manager/line-settings/' + ${account.id} + '/auto-reply/' + ${r.id} + '/toggle-active'}">
                            <input type="hidden" name="_csrf" th:value="${_csrf}"/>
                            <button type="submit"
                                    th:class="${r.isActive} ? 'px-2 py-0.5 text-xs rounded text-white' : 'px-2 py-0.5 text-xs rounded bg-slate-200 text-slate-600'"
                                    th:style="${r.isActive} ? 'background:#06C755;' : ''"
                                    th:text="${r.isActive} ? '有効' : '無効'"></button>
                        </form>
                    </td>
                    <td class="px-3 py-2 text-right">
                        <form method="post" th:action="@{'/manager/line-settings/' + ${account.id} + '/auto-reply/' + ${r.id} + '/delete'}" style="display:inline;"
                              onsubmit="return confirm('このルールを削除します。よろしいですか?');">
                            <input type="hidden" name="_csrf" th:value="${_csrf}"/>
                            <button type="submit" class="px-2 py-1 text-xs bg-rose-50 border border-rose-300 text-rose-700 hover:bg-rose-100 rounded">削除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-slate-100 p-4">
        <p class="text-sm font-medium text-slate-700 mb-3">新しいルールを追加</p>
        <form method="post" th:action="@{'/manager/line-settings/' + ${account.id} + '/auto-reply'}" th:object="${form}">
            <input type="hidden" name="_csrf" th:value="${_csrf}"/>
            <div class="flex flex-wrap items-center gap-3 mb-3">
                <label class="text-sm text-slate-600"><input type="radio" th:field="*{triggerType}" value="FOLLOW"/> 友だち追加時</label>
                <label class="text-sm text-slate-600"><input type="radio" th:field="*{triggerType}" value="KEYWORD"/> キーワード一致時</label>
                <input type="text" th:field="*{keyword}" placeholder="キーワード（キーワード一致時のみ）" class="tw-input" style="width:200px;"/>
                <input type="number" th:field="*{sortOrder}" placeholder="順序 (小さいほど先)" class="tw-input" style="width:140px;"/>
                <label class="text-sm text-slate-600 flex items-center gap-1">
                    <input type="number" th:field="*{delayMinutes}" min="0" max="1440" placeholder="0" class="tw-input" style="width:80px;"/> 分後に返信
                </label>
            </div>
            <textarea th:field="*{replyBody}" rows="3" class="tw-input w-full mb-3" placeholder="自動返信の本文"></textarea>
            <p class="text-xs text-rose-600 mb-2" th:if="${#fields.hasErrors('*')}" th:errors="*{*}"></p>
            <button type="submit" class="px-4 py-2 text-sm text-white rounded-md" style="background:#06C755;">追加</button>
        </form>
    </div>
</section>
</body>
</html>
