<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>LINE表示名/アイコン設定</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">LINE表示名/アイコン設定</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/line-settings}">LINE設定に戻る</a>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        グループLINE風モード（<a class="text-blue-600 hover:underline" th:href="@{/manager/line-settings}">子アカウント一覧</a>の「使用中」トグル）が有効な子アカウントで返信すると、
        顧客からはここで設定した名前・アイコンの担当者として表示されます（1件のLINEアカウントとの1対1チャットの中で、送信者名だけが変わる仕組みです）。
        自分自身の設定のみ変更できます。
    </p>

    <div style="max-width:480px;">
    <form method="post" th:action="@{/manager/line-settings/my-persona}" enctype="multipart/form-data"
          class="bg-white rounded-lg shadow-sm border border-slate-100 p-6">

        <div class="mb-4" th:if="${admin.avatarUrl != null}">
            <label class="block text-sm font-medium text-slate-700 mb-1">現在のアイコン</label>
            <img th:src="${admin.avatarUrl}" class="w-16 h-16 rounded-full border border-slate-200" alt=""/>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">表示名（未設定の場合は管理者名を使用）</label>
            <input type="text" class="tw-input" name="displayName" th:value="${admin.displayName}" maxlength="20" placeholder="例: サポート担当 田中"/>
            <p class="text-xs text-slate-500 mt-1">LINEの仕様上、20文字程度までを推奨します。</p>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-1">アイコン画像（変更する場合のみ選択）</label>
            <input type="file" name="avatar" accept="image/*"/>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="px-4 py-2 text-white text-sm font-bold rounded-md" style="background:#06C755;">保存する</button>
        </div>
    </form>
    </div>
</section>
</body>
</html>
