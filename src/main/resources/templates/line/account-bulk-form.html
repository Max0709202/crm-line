<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>子アカウント一括登録</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4 gap-2">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">子アカウント一括登録</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/line-settings}">LINE設定に戻る</a>
    </div>

    <p class="text-sm text-slate-500 mb-2">
        親アカウント: <strong th:text="${parent.name}"></strong>
    </p>
    <p class="text-sm text-slate-500 mb-4">
        LINE Developersコンソールで手動作成済みの子アカウントの認証情報を、1行に1件ずつ貼り付けてください。
        形式: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs">アカウント名,Channel ID,Channel Secret,Access Token</code>
        （カンマ区切り）。登録後、各アカウントのWebhook URLをLINE Developersコンソールに設定してください。
    </p>

    <form method="post" th:action="@{/manager/line-settings/bulk-new}" class="bg-white rounded-lg shadow-sm border border-slate-100 p-4">
        <input type="hidden" name="_csrf" th:value="${_csrf}"/>
        <input type="hidden" name="parentAccountId" th:value="${parent.id}"/>
        <textarea name="lines" rows="10" class="tw-input w-full font-mono text-xs"
                  placeholder="子アカウントA,1234567890,abcdef0123456789,XXXXXXXXXXXXXXXXXXXXXXXX...&#10;子アカウントB,2234567891,bbcdef0123456789,YYYYYYYYYYYYYYYYYYYYYYYY..."></textarea>
        <div class="mt-3">
            <button type="submit" class="px-4 py-2 text-sm text-white rounded-md" style="background:#06C755;">一括登録</button>
        </div>
    </form>
</section>
</body>
</html>
