<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>返信する</title>
    <th:block th:if="${ogpEnabled}">
        <meta property="og:type" content="website"/>
        <meta th:if="${ogpTitle != null and !ogpTitle.isEmpty()}" property="og:title" th:content="${ogpTitle}"/>
        <meta th:if="${ogpDescription != null and !ogpDescription.isEmpty()}" property="og:description" th:content="${ogpDescription}"/>
        <meta th:if="${ogpImageUrl != null and !ogpImageUrl.isEmpty()}" property="og:image" th:content="${ogpImageUrl}"/>
    </th:block>
    <link rel="stylesheet" th:href="@{/css/reply.css}"/>
    <style th:if="${customCss}" th:utext="${customCss}"></style>
    <style>
        /* The user-supplied header HTML can be a complete document (DOCTYPE/html/head/body
           with its own styles, web fonts, scripts). Inline injection via <div th:utext>
           strips the outer head/styles, so we host it in an iframe via srcdoc — same
           technique as the admin reply-preview page.
           The iframe height is fixed at 500px and any longer header content scrolls
           internally; this keeps the reply form just one viewport down regardless of
           how long the admin's header HTML is. */
        .reply-header-frame {
            display: block; width: 100%; height: 500px;
            border: 0; background: #fff;
        }
        /* Image-attach block (2026-05-26) — sits between the send form and the footer
           on the public reply page. Plain, restrained style so user-supplied custom
           CSS doesn't have to fight with it. */
        .reply-attach-block {
            margin: 16px 0; padding: 14px 16px;
            border: 1px solid #e2e8f0; border-radius: 8px;
            background: #f8fafc; font-size: 14px;
        }
        .reply-attach-label { font-weight: 600; color: #1e293b; margin-bottom: 8px; }
        .reply-attach-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .reply-attach-form input[type=file] { font-size: 13px; }
        .reply-attach-form button {
            padding: 6px 14px; background: #2563eb; color: #fff;
            border: 0; border-radius: 4px; cursor: pointer;
        }
        .reply-attach-form button:hover { background: #1d4ed8; }
        .reply-attach-hint { font-size: 12px; color: #64748b; }
        .reply-attach-err { margin-top: 8px; color: #b91c1c; font-size: 13px; }
        .reply-attach-list-title { margin: 12px 0 6px; font-size: 13px; color: #475569; }
        .reply-attach-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }
        .reply-attach-thumb {
            display: block; aspect-ratio: 1 / 1; overflow: hidden;
            border: 1px solid #cbd5e1; border-radius: 4px;
            background: #fff;
        }
        .reply-attach-thumb img {
            width: 100%; height: 100%; object-fit: cover;
        }
        /* 画像添付 on a received message (📎 + 写真閲覧) */
        .message-box-images { margin: 10px 0 4px; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
        .message-box-images-mark { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 8px; }
        .message-box-images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
        .message-box-image { display: block; aspect-ratio: 1 / 1; overflow: hidden; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; margin: 0; }
        .message-box-image img { width: 100%; height: 100%; object-fit: cover; }
        .message-box-image.is-locked button {
            width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            border: 0; cursor: pointer; font-size: 12px; font-weight: 700; color: #1e293b;
            background: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 6px, #f1f5f9 6px, #f1f5f9 12px);
        }
        .message-box-image.is-locked button span { font-size: 22px; line-height: 1; }
        .message-box-image.is-locked button small { font-size: 11px; font-weight: 600; color: #b45309; }
        .message-box-images-note { margin: 8px 0 0; font-size: 12px; color: #64748b; }
        .reply-point-short { margin: 12px 0; padding: 10px 14px; border: 1px solid #fecaca; border-radius: 8px; background: #fef2f2; color: #b91c1c; font-size: 14px; }
    </style>
</head>
<body>
<!-- 管理画面「表示画面を確認 / 受信ボックス確認」(ReplyPageController#userView): read-only look at this user's 返信画面 -->
<div th:if="${previewUser != null}"
     style="position:sticky;top:0;z-index:2147483647;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px;background:#b91c1c;color:#fff;font:bold 13px/1.5 sans-serif;">
    <span th:text="'管理者プレビュー中：' + (${previewUser.displayName} ?: '') + '（ID ' + ${previewUser.id} + '）— ' + (${previewBox} ? '受信ボックス確認（選択削除できます）' : '閲覧のみ') + '・返信などの送信はできません'">管理者プレビュー中</span>
</div>
<div class="reply-shell">

    <iframe th:if="${headerHtml != null and headerVisible}" class="reply-header-frame"
            sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox"
            th:attr="srcdoc=${headerHtml}"></iframe>

    <th:block th:if="${replyFormVisible}">
        <div class="reply-banner">
            <h1>入力欄</h1>
        </div>

        <!-- Reply form: text body + optional image attachments in ONE multipart POST. The
             previous 2-form layout confused operators (送信する only sent text, 添付する only
             uploaded files) — combined here per operator request 2026-05-26. -->
        <form class="reply-form" th:action="@{'/reply/' + ${token} + '/send'}" method="post"
              th:object="${form}" enctype="multipart/form-data">

            <div class="field">
                <textarea id="body" name="body" rows="9" maxlength="10000" th:text="*{body}"></textarea>
            </div>

            <!-- Inline attachment picker — accepts multiple images, sent together with the body -->
            <div class="reply-attach-block">
                <div class="reply-attach-label">画像添付 (任意)</div>
                <input type="file" name="files" multiple
                       accept="image/jpeg,image/png,image/gif,image/webp"
                       class="reply-attach-file"/>
                <div class="reply-attach-hint"
                     th:text="'JPEG / PNG / GIF / WebP, 1 ファイル最大 ' + ${maxAttachmentSizeMB} + ' MB / 複数選択可'"></div>
                <div th:if="${errorMessage != null}" class="reply-attach-err" th:text="${errorMessage}"></div>
            </div>

            <div th:if="${#fields.hasErrors('*')}" class="field-errors">
                <p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p>
            </div>

            <div class="actions">
                <button type="submit">送信する</button>
            </div>
        </form>

        <!-- User-visible confirmation grid of previously-attached images on the active slot.
             When the admin switches active slot, this list will switch too on next visit. -->
        <div class="reply-attach-list" th:if="${attachments != null and !attachments.empty}">
            <div th:text="'添付済み画像 (' + ${attachments.size()} + ' 件)'" class="reply-attach-list-title"></div>
            <div class="reply-attach-grid">
                <a th:each="a : ${attachments}"
                   th:href="@{'/reply/' + ${token} + '/attachment/' + ${a.id}}"
                   target="_blank"
                   class="reply-attach-thumb">
                    <img th:src="@{'/reply/' + ${token} + '/attachment/' + ${a.id}}"
                         th:alt="${a.fileName}"/>
                </a>
            </div>
        </div>
    </th:block>

    <div th:if="${footerHtml}" class="reply-footer" th:utext="${footerHtml}"></div>

    <div th:if="${pointShort}" class="reply-point-short">ポイントが足りないため、写真を表示できませんでした。ポイントを購入してからもう一度お試しください。</div>

    <div th:if="${messageBox != null}"
         th:replace="~{fragment/message-box :: messageBox(${messageBox}, ${inboundBox}, ${token}, false, null)}"></div>
</div>

<!-- Preview: nothing here may be sent as the user (入力欄・返信・写真閲覧) — only the 選択削除 forms stay usable. -->
<script th:if="${previewUser != null}">
    document.querySelectorAll('form').forEach(function (f) {
        if (/^messageBoxDelete/.test(f.id)) return;
        f.addEventListener('submit', function (e) { e.preventDefault(); });
        f.querySelectorAll('input, textarea, button, select').forEach(function (el) { el.disabled = true; });
    });
</script>

</body>
</html>
