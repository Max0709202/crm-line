<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title th:text="${pageTitle} + ' | ' + ${siteName}">ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!-- Footer pages of the public member site (/page/{code}) and the 準備中 page. Same look as the
     pre-login top page (site/top.html); page bodies are edited on 番組デザイン設定. The footer is the
     shared fixed footer (PublicSiteService#footerHtml). -->
<style>
:root{--ink:#16324A;--ink-2:#4F6679;--line:#D5E5EF;--sea:#0F74C2;--foam:#EEF8FC;--pink:#DD1470;--pink-bright:#FF4F9A;--navy:#0E2B45;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;--wrap:1120px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-weight:500;font-size:16px;line-height:1.8;color:var(--ink);background:var(--foam);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
.header-in{max-width:var(--wrap);height:68px;margin:0 auto;padding:0 20px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;color:var(--pink);min-width:0}
.brand svg{width:26px;height:26px;flex:none;color:var(--pink-bright)}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand img{height:44px;width:auto;max-width:260px;object-fit:contain}
main{flex:1;padding:40px 20px 72px}
.card{max-width:860px;margin:0 auto;background:#fff;border-radius:24px;padding:36px 36px 40px;box-shadow:0 20px 50px -34px rgba(14,70,120,.4)}
.card h1{margin:0 0 20px;font-size:clamp(22px,3vw,30px);font-weight:900;line-height:1.45}
.body{overflow-wrap:anywhere}
.body a{color:var(--sea);text-decoration:underline;text-underline-offset:3px}
.body img{max-width:100%;height:auto}
.empty{color:var(--ink-2)}
.back{display:inline-block;margin-top:28px;color:var(--sea);font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media (max-width:760px){.header-in{height:58px;padding:0 16px}.brand{font-size:19px}.brand img{height:36px;max-width:170px}main{padding:24px 12px 56px}.card{padding:26px 20px 30px;border-radius:20px}}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-in">
    <a class="brand" href="/" th:attr="aria-label=${siteName} + ' トップ'">
      <img th:if="${logoUrl != null}" th:src="${logoUrl}" th:alt="${siteName}">
      <th:block th:if="${logoUrl == null}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.4-4.5-9.5-9.2C1 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.3 2.5.7-1.3 2.2-2.5 4.3-2.5 3.7 0 5.7 3.9 4.2 7.3C19.4 16.5 12 21 12 21z"/></svg>
        <span th:text="${siteName}">サイト名</span>
      </th:block>
    </a>
  </div>
</header>

<main>
  <article class="card">
    <h1 th:text="${pageTitle}">ページ</h1>
    <div class="body" th:if="${pageHtml != null and !pageHtml.isEmpty()}" th:utext="${pageHtml}"></div>
    <p class="empty" th:if="${pageHtml == null or pageHtml.isEmpty()}">現在準備中です。</p>
    <a class="back" href="/">トップへ戻る</a>
  </article>
</main>

<th:block th:utext="${footerHtml}"></th:block>
</body>
</html>
